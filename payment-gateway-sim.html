<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTC eRequest | Payment Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-900">
    <main class="flex min-h-screen items-center justify-center px-4 py-10">
        <section class="w-full max-w-md rounded-3xl bg-white p-8 shadow-xl">
            <div class="mb-6 text-center">
                <p class="text-xs font-black uppercase tracking-[0.3em] text-blue-600">Simulated Gateway</p>
                <h1 class="mt-3 text-2xl font-black text-slate-900">Processing Payment</h1>
                <p class="mt-2 text-sm text-slate-500">This page simulates an external payment provider.</p>
            </div>

            <div class="mb-6 rounded-2xl border border-slate-200 bg-slate-50 p-5">
                <div class="mb-3 flex items-center justify-between text-sm">
                    <span class="font-bold text-slate-500">Request ID</span>
                    <span id="request-id" class="font-black text-slate-800">-</span>
                </div>
                <div class="mb-3 flex items-center justify-between text-sm">
                    <span class="font-bold text-slate-500">Document</span>
                    <span id="document-type" class="text-right font-black text-slate-800">-</span>
                </div>
                <div class="flex items-center justify-between text-sm">
                    <span class="font-bold text-slate-500">Method</span>
                    <span id="payment-method" class="font-black text-slate-800">-</span>
                </div>
            </div>

            <div class="mb-6">
                <div class="mb-2 flex items-center justify-between text-sm font-bold text-slate-500">
                    <span>Connecting to gateway</span>
                    <span id="progress-text">0%</span>
                </div>
                <div class="h-3 overflow-hidden rounded-full bg-slate-200">
                    <div id="progress-bar" class="h-full w-0 rounded-full bg-blue-600 transition-all duration-300"></div>
                </div>
            </div>

            <div id="status-card" class="rounded-2xl bg-blue-50 p-4 text-sm font-bold text-blue-700">
                Redirecting back to the student dashboard after payment confirmation.
            </div>
        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const requestId = params.get("requestId") || "-";
        const documentType = params.get("documentType") || "Document Request";
        const paymentMethod = params.get("paymentMethod") || "Unknown";

        document.getElementById("request-id").textContent = requestId;
        document.getElementById("document-type").textContent = documentType;
        document.getElementById("payment-method").textContent = paymentMethod;

        const progressBar = document.getElementById("progress-bar");
        const progressText = document.getElementById("progress-text");
        const statusCard = document.getElementById("status-card");

        let progress = 0;
        const timer = window.setInterval(() => {
            progress += 20;
            progressBar.style.width = `${progress}%`;
            progressText.textContent = `${progress}%`;

            if (progress >= 100) {
                window.clearInterval(timer);
                statusCard.className = "rounded-2xl bg-green-50 p-4 text-sm font-bold text-green-700";
                statusCard.textContent = "Payment approved. Returning to the dashboard...";

                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage(
                        { type: "NTC_PAYMENT_GATEWAY_SUCCESS", requestId },
                        window.location.origin
                    );
                }

                window.setTimeout(() => {
                    window.close();
                }, 1200);
            }
        }, 350);
    </script>
</body>
</html>
