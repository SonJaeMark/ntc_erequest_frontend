<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Welcome Back</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        // This replaces the default Tailwind 'sans' font with Lato
                        sans: ['Lato', 'ui-sans-serif', 'system-ui'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    
    <div class="w-full max-w-sm">
        <form id="login-form" class="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-blue-600">
            <header class="text-center mb-8">
                <h2 class="text-3xl font-black text-blue-900 tracking-tight">Welcome Back</h2>
                <p class="text-gray-500 text-sm mt-1">Please enter your details</p>
            </header>

            <div class="mb-5">
                <label for="email" class="block text-sm font-bold text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" required 
                    placeholder="name@company.com"
                    class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>

            <div class="mb-6">
                <label for="password" class="block text-sm font-bold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required 
                    placeholder="••••••••"
                    class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition-colors shadow-md active:transform active:scale-[0.98]">
                Sign In
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
