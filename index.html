<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTC eRequest | Log-in</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Lato', 'ui-sans-serif', 'system-ui'],
                    }
                }
            }
        }
    </script>

    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }

        /* Subtle animated gradient for left panel */
        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .left-panel {
            background: linear-gradient(135deg, #1e3a8a, #1d4ed8, #2563eb, #1e40af);
            background-size: 300% 300%;
            animation: gradientShift 8s ease infinite;
        }

        /* Decorative ring behind logo */
        .logo-ring {
            box-shadow: 0 0 0 8px rgba(255,255,255,0.08), 0 0 0 16px rgba(255,255,255,0.04);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- ============================================================ -->
    <!-- LOGIN CARD -->
    <!-- ============================================================ -->
    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[480px]">

        <!-- ── LEFT PANEL ── -->
        <div class="left-panel relative flex flex-col items-center justify-center px-8 py-10 md:w-5/12 text-white text-center flex-shrink-0">

            
            <!-- Logo -->
            <div class="logo-ring rounded-full mb-5 flex-shrink-0 relative z-10">
            <img src="https://ntc.edu.ph/wp-content/uploads/2021/12/NTC_Main-Full-Color-2-1.webp"
                alt="National Teachers College Logo"
            class="w-28 h-28 rounded-full object-contain bg-white p-1.5" />
            </div>

            <!-- School name -->
            <h1 class="text-xl font-black tracking-tight leading-tight relative z-10">
                National Teachers<br>College
            </h1>
            <p class="text-blue-200 text-xs mt-2 font-bold tracking-widest uppercase relative z-10">e-Request Portal</p>

            <!-- Divider -->
            <div class="w-10 h-0.5 bg-white opacity-30 rounded-full my-4 relative z-10"></div>

            <p class="text-blue-100 text-xs leading-relaxed relative z-10 max-w-[180px]">
                Request your academic documents anytime, anywhere.
            </p>
        </div>

        <!-- ── RIGHT PANEL (Form) ── -->
        <div class="flex-1 flex flex-col justify-center px-8 py-10">

            <header class="mb-7">
                <h2 class="text-2xl font-black text-blue-900 tracking-tight">Welcome Back</h2>
                <p class="text-gray-400 text-sm mt-1">Please enter your details to sign in.</p>
            </header>

            <form id="login-form" class="space-y-5">

                <!-- Email -->
                <div>
                    <label for="email" class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-1.5">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="name@company.com"
                        class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" />
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-1.5">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="••••••••"
                        class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" />
                </div>

                <!-- Error Message -->
                <div id="login-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-center">
                    Invalid email or password. Please try again.
                </div>

                <!-- Submit -->
                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition-colors shadow-md active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2 mt-2">
                    <span id="btn-text">Sign In</span>
                </button>

            </form>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- SCRIPTS -->
    <!-- ============================================================ -->
    <script type="module" src="js/login.js"></script>

</body>
</html>
