<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTC Student Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="auth-guard.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        // This replaces the default Tailwind 'sans' font with Lato
                        sans: ['Lato', 'ui-sans-serif', 'system-ui'],
                    }
                }
            }
        }
    </script>
</head>
<body>
    <!-- <script>
        requireRole(["STUDENT"]);
    </script>
    <h1>Student Dashboard</h1> -->

<div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-lg">
  <h2 class="text-2xl font-bold mb-6 text-center">Document Request</h2>

  <form id="requestForm" class="space-y-4">

    <!-- Purpose -->
    <div>
      <label class="block font-medium">Purpose</label>
      <select id="purpose" class="w-full border rounded-lg p-2">
        <option value="">Select Purpose</option>
        <option value="WORK">WORK</option>
        <option value="SCHOLARSHIP">SCHOLARSHIP</option>
        <option value="TRANSFERRING_SCHOOL">TRANSFERRING SCHOOL</option>
        <option value="OJT">OJT</option>
      </select>
    </div>

    <!-- Document Type -->
    <div>
      <label class="block font-medium">Document Type</label>
      <select id="documentType" class="w-full border rounded-lg p-2">
        <option value="">Loading...</option>
      </select>
    </div>

    <!-- Additional Details -->
    <div>
      <label class="block font-medium">Additional Details</label>
      <textarea id="additionalDetails" class="w-full border rounded-lg p-2" rows="3"></textarea>
    </div>

    <!-- Request Status -->
    <div>
      <label class="block font-medium">Request Status</label>
      <input type="text" value="PENDING" readonly class="w-full border rounded-lg p-2 bg-gray-100">
    </div>

    <!-- Buttons -->
    <div class="flex gap-2">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg w-full hover:bg-blue-700">
        Request Document
      </button>

      <button type="button" onclick="cancelRequest()" class="bg-red-500 text-white px-4 py-2 rounded-lg w-full hover:bg-red-600">
        Cancel
      </button>
    </div>

  </form>
</div>

<script>
const BASE_URL = "https://ntc-erquest-system-1.onrender.com";

// Store documents globally
let documents = [];

// Fetch documents and populate dropdown
async function loadDocuments() {
  const token = sessionStorage.getItem("ntc_access_token");
  console.log(token)
  try {
    const res = await fetch(`${BASE_URL}/api/document/student`, {
      method:"GET",
      headers: {
        "Authorization": `Bearer ${token}`
      }
    });

    if (!res.ok) throw new Error("Failed to fetch documents");

    documents = await res.json();

    const select = document.getElementById("documentType");
    select.innerHTML = '<option value="">Select Document</option>';

    documents.forEach(doc => {
      const option = document.createElement("option");
      option.value = doc.id; // IMPORTANT: store id
      option.textContent = doc.documentType; // display type
      option.dataset.type = doc.documentType;
      select.appendChild(option);
    });

  } catch (err) {
    console.error(err);
    alert("Error loading documents");
  }
}

// Submit form
document.getElementById("requestForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const token = sessionStorage.getItem("ntc_access_token");
  const studentId = localStorage.getItem("userId");

  const documentSelect = document.getElementById("documentType");
  const selectedOption = documentSelect.options[documentSelect.selectedIndex];

  const payload = {
    purpose: document.getElementById("purpose").value,
    documentType: selectedOption.dataset.type,
    documentId: parseInt(documentSelect.value),
    additionalDetails: document.getElementById("additionalDetails").value,
    remarks: "",
    status: "PENDING",
    studentId: parseInt(studentId),
    registrarId: 0
  };

  try {
    const res = await fetch(`${BASE_URL}/api/document-request/submit`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });

    if (!res.ok) throw new Error("Submission failed");

    alert("Request submitted successfully!");
    document.getElementById("requestForm").reset();

  } catch (err) {
    console.error(err);
    alert("Error submitting request");
  }
});

// Cancel button
function cancelRequest() {
  document.getElementById("requestForm").reset();
}

// Load on page start
loadDocuments();
</script>

</body>
</html>
