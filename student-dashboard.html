<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Teachers College | Submit Request</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="auth-guard.js"></script>

    <style>
        #mobile-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 0;
        }
        #mobile-menu.open {
            max-height: 400px;
            opacity: 1;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Lato', 'ui-sans-serif', 'system-ui'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 shadow-sm px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">

            <!-- Logo / School Name -->
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white font-black text-sm px-2.5 py-1.5 rounded-lg tracking-tight">NTC</div>
                <span class="text-blue-900 font-black text-base md:text-lg tracking-tight hidden sm:block">National Teachers College</span>
                <span class="text-blue-900 font-black text-base tracking-tight sm:hidden">NTC</span>
            </div>

            <!-- Desktop Nav Links -->
            <div class="hidden md:flex items-center gap-6">
                <a href="student-dashboard.html" class="text-sm font-bold text-gray-500 hover:text-blue-600 transition-colors">Dashboard</a>
                <a href="document-request.html" class="text-sm font-bold text-blue-600 border-b-2 border-blue-600 pb-0.5">Request Document</a>
                <a href="request-history.html" class="text-sm font-bold text-gray-500 hover:text-blue-600 transition-colors">My Requests</a>
            </div>

            <!-- Right: Hi + Name, Logout & Hamburger -->
            <div class="flex items-center gap-3">
                <span class="text-sm text-gray-600 hidden sm:block">Hi, <span id="navbar-firstname" class="font-bold text-blue-900"></span></span>
                <button id="logout-btn" class="hidden md:block text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 px-4 py-1.5 rounded-lg transition-colors active:transform active:scale-[0.98]">
                    Logout
                </button>
                <!-- Hamburger -->
                <button id="hamburger-btn" class="md:hidden flex flex-col gap-1.5 p-1" aria-label="Toggle navigation menu">
                    <span class="block w-5 h-0.5 bg-gray-700 transition-all" aria-hidden="true"></span>
                    <span class="block w-5 h-0.5 bg-gray-700 transition-all" aria-hidden="true"></span>
                    <span class="block w-5 h-0.5 bg-gray-700 transition-all" aria-hidden="true"></span>
                </button>
            </div>

        </div>

        <!-- Mobile Menu (smooth dropdown) -->
        <div id="mobile-menu" class="md:hidden border-t border-gray-100">
            <div class="flex flex-col gap-1 pt-3 pb-2">
                <span class="text-sm text-gray-600 px-2 py-1.5">Hi, <span id="navbar-firstname-mobile" class="font-bold text-blue-900"></span></span>
                <a href="student-dashboard.html" class="text-sm font-bold text-gray-500 hover:text-blue-600 hover:bg-gray-50 px-2 py-2 rounded-lg transition-colors">Dashboard</a>
                <a href="document-request.html" class="text-sm font-bold text-blue-600 bg-blue-50 px-2 py-2 rounded-lg">Request Document</a>
                <a href="request-history.html" class="text-sm font-bold text-gray-500 hover:text-blue-600 hover:bg-gray-50 px-2 py-2 rounded-lg transition-colors">My Requests</a>
                <button id="logout-btn-mobile" class="text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg transition-colors mt-1 active:transform active:scale-[0.98]">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Form -->
    <div class="flex items-center justify-center p-4 py-10">
        <div class="w-full max-w-sm">
            <form id="document-request-form" class="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-blue-600">

                <header class="text-center mb-8">
                    <h2 class="text-3xl font-black text-blue-900 tracking-tight">Document Request</h2>
                    <p class="text-gray-500 text-sm mt-1">Fill in the details below to submit your request</p>
                </header>

                <div class="mb-5">
                    <label for="purpose" class="block text-sm font-bold text-gray-700 mb-1">Purpose</label>
                    <select id="purpose" name="purpose" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                        <option value="" disabled selected>Select a purpose</option>
                        <option value="WORK">Work</option>
                        <option value="SCHOLARSHIP">Scholarship</option>
                        <option value="TRANSFERRING_SCHOOL">Transferring School</option>
                        <option value="OJT">OJT</option>
                    </select>
                </div>

                <div class="mb-5">
                    <label for="documentType" class="block text-sm font-bold text-gray-700 mb-1">Document type</label>
                    <select id="documentType" name="documentType" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                        <option value="" disabled selected>Select document type</option>
                        <option value="TOR">TOR</option>
                        <option value="CERTIFICATE_OF_ENROLLMENT">Certificate of Enrollment</option>
                        <option value="GOOD_MORAL">Good Moral</option>
                        <option value="DIPLOMA">Diploma</option>
                        <option value="HONORABLE_DISMISSAL">Honorable Dismissal</option>
                        <option value="CERTIFICATE_OF_REGISTRATION">Certificate of Registration</option>
                    </select>
                </div>

                <div class="mb-5">
                    <label for="additionalDetails" class="block text-sm font-bold text-gray-700 mb-1">Additional details</label>
                    <textarea id="additionalDetails" name="additionalDetails" rows="3" placeholder="Provide any additional details..." class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"></textarea>
                </div>

                <div class="flex gap-3">
                    <button type="button" id="cancel-btn"
                        class="w-full border border-gray-300 hover:bg-gray-100 text-gray-700 font-bold py-2.5 rounded-lg transition-colors shadow-md active:transform active:scale-[0.98]">
                        Cancel
                    </button>
                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition-colors shadow-md active:transform active:scale-[0.98]">
                        Submit Request
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script src="studentDashBoardScript.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const firstNameEl = document.getElementById("navbar-firstname");
            const firstNameMobileEl = document.getElementById("navbar-firstname-mobile");
            const logoutBtn = document.getElementById("logout-btn");
            const logoutBtnMobile = document.getElementById("logout-btn-mobile");
            const hamburgerBtn = document.getElementById("hamburger-btn");
            const mobileMenu = document.getElementById("mobile-menu");
            const cancelBtn = document.getElementById("cancel-btn");

            const getFirstName = () => {
                const email = sessionStorage.getItem("email") ?? "";
                return email.split("@")[0] ?? "Student";
            };

            const logout = () => {
                sessionStorage.clear();
                localStorage.clear();
                window.location.href = "index.html";
            };

            const firstName = getFirstName();
            if (firstNameEl) firstNameEl.textContent = firstName;
            if (firstNameMobileEl) firstNameMobileEl.textContent = firstName;

            if (logoutBtn) logoutBtn.addEventListener("click", logout);
            if (logoutBtnMobile) logoutBtnMobile.addEventListener("click", logout);

            if (cancelBtn) cancelBtn.addEventListener("click", () => {
                window.location.href = "student-dashboard.html";
            });

            if (hamburgerBtn) {
                hamburgerBtn.addEventListener("click", () => {
                    mobileMenu.classList.toggle("open");
                });
            }
        });
    </script>

</body>
</html>
